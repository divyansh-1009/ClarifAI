name: clarifai_frontend
description: "ClarifAI - Intelligent Learning Assistant powered by AI"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.6.0

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.2

  # Markdown rendering (for AI answers)
  flutter_markdown: ^0.7.4

  # File picking (PDF upload)
  file_picker: ^8.1.2

  # Google Fonts
  google_fonts: ^6.2.1

  # Math rendering for assessment questions
  flutter_math_fork: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
